<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digita il prof o il corso, trova subito l'aula: orari in tempo reale del Politecnico in stile carta d'imbarco."
    />
    <meta name="theme-color" content="#0a0e17" />
    <title>PoliDove</title>
    <meta property="og:title" content="PoliDove" />
    <meta
      property="og:description"
      content="Digita il prof o il corso, trova subito l'aula: orari in tempo reale del Politecnico in stile carta d'imbarco."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PoliDove" />
    <meta
      name="twitter:description"
      content="Digita il prof o il corso, trova subito l'aula: orari in tempo reale del Politecnico in stile carta d'imbarco."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <button id="lang-toggle-btn" type="button" title="Switch to English" aria-label="Switch to English">EN</button>
      <button id="reload-btn" type="button" title="Aggiorna dati" aria-label="Aggiorna dati">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <header class="intro">
        <h1>PoliDove</h1>
        <p>Digita il prof, trova l'aula.</p>
        <p id="updated-at" class="updated-at" hidden></p>
      </header>
      <div class="search-wrap">
        <input
          id="search-input"
          type="search"
          placeholder="Docente o corso…"
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="results-list"
        />
        <button id="search-clear-btn" type="button" class="search-clear-btn" aria-label="Cancella ricerca" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <ul id="results-list" class="results-list" role="listbox" hidden></ul>
      </div>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="ticket-container"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
